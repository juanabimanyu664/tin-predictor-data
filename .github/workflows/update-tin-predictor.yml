name: Update Tin Predictor DB

on:
  schedule:
    # 10:00 UTC = 17:00 WIB (Asia/Jakarta, UTC+7). GitHub Actions cron can
    # slip by a few/many minutes under load, so don't rely on exact timing.
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run daily update
        run: python update_tin_predictor.py

      - name: Commit and push if the DB changed
        run: |
          git config user.name "tin-predictor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tin_predictor.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily data update: $(date -u +'%Y-%m-%d')"
            git push
          fi
